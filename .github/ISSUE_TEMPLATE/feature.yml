name: 功能需求
description: 新功能或改进
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与用户价值
    validations: { required: true }
  - type: dropdown
    id: module
    attributes:
      label: 所属模块（限界上下文）
      options: [identity, projects, collection, analysis, audit, metrics, alerts (P2), web, infra, 新模块（需 ADR）]
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: 路线图阶段
      description: 见 docs/roadmap.md。当前阶段"明确不做"清单里的需求会被推迟。
      options: [P1 MVP, P2 平台化, P3 开放平台]
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
