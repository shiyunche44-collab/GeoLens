# Local stack. P1 runs everything on one host; P2 splits collect.cn / collect.global
# workers into region-local collector agents (see docs/architecture.md).
x-api-env: &api-env
  GEOLENS_DATABASE_URL: postgresql+psycopg://geolens:geolens@postgres:5432/geolens
  GEOLENS_REDIS_URL: redis://redis:6379/0
  GEOLENS_STORAGE_BACKEND: s3
  GEOLENS_S3_ENDPOINT_URL: http://minio:9000
  GEOLENS_S3_ACCESS_KEY: geolens
  GEOLENS_S3_SECRET_KEY: geolens-secret
  GEOLENS_S3_BUCKET: geolens-raw

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens
      POSTGRES_DB: geolens
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolens"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geolens
      MINIO_ROOT_PASSWORD: geolens-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 geolens geolens-secret; do sleep 1; done;
             mc mb --ignore-existing local/geolens-raw"

  migrate:
    build: apps/api
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: apps/api
    env_file: [{ path: .env, required: false }]
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: apps/api
    env_file: [{ path: .env, required: false }]
    environment: *api-env
    command: ["celery", "-A", "geolens.app.worker", "worker",
              "-Q", "default,collect.cn,collect.global,analyze,audit", "--loglevel=info"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

  web:
    build:
      context: apps/web
      args: { GEOLENS_API_URL: "http://api:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
